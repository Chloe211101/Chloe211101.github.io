<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏭 生产预算管理系统 · 实时协作版</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <style>
        /* ====== 完整样式 ====== */
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --primary-dark: #1E2A5A;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F3F6FC;
            --card-bg: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --shadow: 0 4px 20px rgba(30, 58, 138, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: calc(80px + var(--safe-bottom));
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 4px;
        }
        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .app-header {
            background: var(--primary);
            color: #fff;
            padding: 16px 0 14px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 4px 20px rgba(30, 58, 138, 0.3);
        }
        .app-header .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header h1 small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.8;
            margin-left: 4px;
        }
        .app-header .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .app-header .header-date {
            font-size: 14px;
            opacity: 0.85;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }
        .sync-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .sync-status .dot.online {
            background: #4ADE80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        .sync-status .dot.offline {
            background: #F87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
            animation: pulse 1.5s infinite;
        }
        .sync-status .dot.syncing {
            background: #FBBF24;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 20px 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            flex-wrap: wrap;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 8px 30px rgba(30, 58, 138, 0.12);
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn {
            border: none;
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            background: #fff;
            color: var(--text-primary);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: var(--bg);
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:hover td {
            background: #FAFBFF;
        }
        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag-warning {
            background: #FEF3C7;
            color: #92400E;
        }
        .tag-danger {
            background: #FEE2E2;
            color: #991B1B;
        }
        .tag-success {
            background: #D1FAE5;
            color: #065F46;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
        }
        .fill.green {
            background: var(--success);
        }
        .fill.yellow {
            background: var(--warning);
        }
        .fill.red {
            background: var(--danger);
        }
        .alert-card {
            border-left: 4px solid var(--warning);
            padding: 12px 16px;
            background: #FFFBEB;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }
        .alert-card.danger {
            border-left-color: var(--danger);
            background: #FEF2F2;
        }
        .alert-card.success {
            border-left-color: var(--success);
            background: #ECFDF5;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-content .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .modal-content .modal-close:hover {
            background: var(--bg);
        }
        .modal-content h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-right: 30px;
        }
        .modal-content .text-muted {
            color: var(--text-light);
        }
        .modal-content .text-small {
            font-size: 13px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 calc(6px + var(--safe-bottom));
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.06);
            border-top: 1px solid var(--border);
            z-index: 50;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.96);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px 12px;
            transition: var(--transition);
            gap: 2px;
            font-weight: 500;
        }
        .bottom-nav .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1.2;
        }
        .bottom-nav .nav-item.active {
            color: var(--primary);
        }
        .bottom-nav .nav-item .nav-label {
            font-size: 10px;
            letter-spacing: 0.3px;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.warning {
            background: var(--warning);
        }
        .batch-card {
            border-left: 4px solid var(--primary-light);
            margin-bottom: 12px;
            padding: 14px 16px;
            background: #FAFBFF;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
        }
        .batch-card:hover {
            background: #F0F5FF;
        }
        .batch-card .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .batch-card .batch-name {
            font-weight: 700;
            font-size: 16px;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }
        .category-item:last-child {
            border-bottom: none;
        }
        .category-item .cat-name {
            font-weight: 500;
        }
        .category-item .cat-usage {
            font-size: 12px;
            color: var(--text-light);
            margin-right: 12px;
        }
        @media (max-width: 640px) {
            .app-header h1 {
                font-size: 18px;
            }
            .app-header h1 small {
                font-size: 12px;
            }
            .container {
                padding: 0 12px;
            }
            .modal-content {
                padding: 20px 16px;
            }
            .table-wrap {
                font-size: 12px;
            }
            th,
            td {
                padding: 6px 8px;
            }
            .sync-status {
                font-size: 11px;
                padding: 2px 10px;
            }
            .sync-status .dot {
                width: 8px;
                height: 8px;
            }
        }
        .text-muted {
            color: var(--text-light);
        }
        .text-small {
            font-size: 13px;
        }
        .share-banner {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 14px;
            color: #065F46;
        }
        .share-banner .copy-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 4px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .share-banner .copy-btn:hover {
            background: var(--primary-dark);
        }
        .share-banner .url-display {
            flex: 1;
            min-width: 180px;
            font-size: 13px;
            word-break: break-all;
            background: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #A7F3D0;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="container">
            <div class="header-inner">
                <h1>🏭 生产预算 <small>实时协作版</small></h1>
                <div class="header-right">
                    <span class="sync-status" id="syncStatus">
                        <span class="dot offline" id="syncDot"></span>
                        <span id="syncLabel">离线</span>
                    </span>
                    <span class="header-date" id="headerDate"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="share-banner">
            <span>🔗 分享此链接即可与团队实时同步数据</span>
            <div class="url-display" id="shareUrlDisplay">加载中...</div>
            <button class="copy-btn" id="copyShareUrl">📋 复制链接</button>
        </div>

        <section class="page active" id="pageBatches">
            <div class="flex-between section-title">
                <span>📦 批次预算管理</span>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn btn-outline" id="btnManageBatchCategories">⚙️ 管理类别</button>
                    <button class="btn btn-success" id="btnDownloadAllBatches">📥 下载全部批次</button>
                    <button class="btn btn-primary" id="btnAddBatch">+ 新建批次</button>
                </div>
            </div>
            <div class="card" style="padding:12px 16px;">
                <div class="flex-between">
                    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                        <label style="font-weight:600; font-size:14px;">🔍 筛选批次：</label>
                        <input type="text" id="batchFilter" placeholder="批次名称/编号" style="padding:6px 12px; border:2px solid var(--border); border-radius:8px; font-size:14px; width:200px;" />
                        <button class="btn btn-primary btn-sm" id="btnFilterBatch">筛选</button>
                        <button class="btn btn-outline btn-sm" id="btnClearFilter">清除</button>
                    </div>
                    <span class="text-muted text-small" id="batchCount">共 0 个批次</span>
                </div>
            </div>
            <div id="batchListContainer"></div>
        </section>

        <section class="page" id="pageExpenses">
            <div class="flex-between section-title">
                <span>📅 月度支出预算</span>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn btn-outline" id="btnManageMonthlyCategories">⚙️ 管理类别</button>
                    <button class="btn btn-success" id="btnDownloadAllMonthly">📥 下载全部月度</button>
                    <button class="btn btn-primary" id="btnAddMonthlyBudget">+ 新建月度预算</button>
                </div>
            </div>
            <div id="monthlyBudgetList"></div>
        </section>

        <section class="page" id="pageAlerts">
            <div class="section-title"><span>🚨 预警看板</span></div>
            <div id="alertBoard"></div>
        </section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="pageBatches"><span class="nav-icon">📦</span><span class="nav-label">批次</span></button>
        <button class="nav-item" data-page="pageExpenses"><span class="nav-icon">📅</span><span class="nav-label">支出</span></button>
        <button class="nav-item" data-page="pageAlerts"><span class="nav-icon">🚨</span><span class="nav-label">预警</span></button>
    </nav>

    <div class="toast" id="toast"></div>

    <!-- ====== 所有模态框 ====== -->
    <div class="modal-overlay" id="modalBatch">
        <div class="modal-content">
            <button class="modal-close" id="closeBatchModal">✕</button>
            <h2>📦 新建批次预算</h2>
            <form id="batchForm">
                <div class="form-group">
                    <label>批次名称 / 编号 *</label>
                    <input type="text" id="batchName" placeholder="如：B202508-01" required />
                </div>
                <div class="form-group">
                    <label>预算项（按类别输入预算金额）</label>
                    <div id="budgetItemsContainer"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">保存批次预算</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalEditBatch">
        <div class="modal-content">
            <button class="modal-close" id="closeEditBatchModal">✕</button>
            <h2>✏️ 编辑批次预算</h2>
            <form id="editBatchForm">
                <input type="hidden" id="editBatchId" />
                <div class="form-group">
                    <label>批次名称</label>
                    <input type="text" id="editBatchName" disabled style="background:#f3f4f6;" />
                </div>
                <div class="form-group">
                    <label>预算项（修改金额，0表示移除该项）</label>
                    <div id="editBudgetItemsContainer"></div>
                </div>
                <button type="submit" class="btn btn-warning" style="width:100%; justify-content:center;">更新预算</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalBatchActual">
        <div class="modal-content">
            <button class="modal-close" id="closeBatchActualModal">✕</button>
            <h2>📝 录入批次实际支出</h2>
            <p style="margin-bottom:12px; color:var(--text-secondary);" id="batchActualTitle">批次：</p>
            <form id="batchActualForm">
                <input type="hidden" id="batchActualId" />
                <div class="form-group">
                    <label>费用类别 *</label>
                    <select id="batchActualCategory" required></select>
                </div>
                <div class="form-group">
                    <label>金额 (¥) *</label>
                    <input type="number" id="batchActualAmount" placeholder="0.00" step="0.01" min="0.01" required />
                </div>
                <div class="form-group">
                    <label>日期 *</label>
                    <input type="date" id="batchActualDate" required />
                </div>
                <button type="submit" class="btn btn-success" style="width:100%; justify-content:center;">保存支出</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalMonthlyBudget">
        <div class="modal-content">
            <button class="modal-close" id="closeMonthlyModal">✕</button>
            <h2>📅 新建月度支出预算</h2>
            <form id="monthlyBudgetForm">
                <div class="form-group">
                    <label>月份 *</label>
                    <input type="month" id="monthlyMonth" required />
                </div>
                <div class="form-group">
                    <label>预算项</label>
                    <div id="monthlyItemsContainer"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">保存月度预算</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalEditMonthly">
        <div class="modal-content">
            <button class="modal-close" id="closeEditMonthlyModal">✕</button>
            <h2>✏️ 编辑月度支出预算</h2>
            <form id="editMonthlyForm">
                <input type="hidden" id="editMonthlyMonth" />
                <div class="form-group">
                    <label>月份</label>

    <script>
        // ================================================================

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAWTKeDGV1BT0LaWHyYJKMBV7PZGImh0vU",
            authDomain: "qin-wang-s-budget-management.firebaseapp.com",
            databaseURL: "https://qin-wang-s-budget-management-default-rtdb.asia-southeast1.firebasedatabase.app",

        // ================================================================
        //  初始化 Firebase
        // ================================================================
        let db = null;
        let firebaseInitialized = false;
        let currentProjectId = 'default';

        function initFirebase() {
            try {
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                }
                db = firebase.database();
                firebaseInitialized = true;
                updateSyncStatus(true);
                console.log('✅ Firebase 初始化成功');
                return true;
            } catch (e) {
                console.error('❌ Firebase 初始化失败:', e);
                updateSyncStatus(false);
                showToast('⚠️ Firebase 连接失败，请检查配置', 'error');
                return false;
            }
        }

        // ================================================================
        //  数据层
        // ================================================================
        function getRootRef() {
            const params = new URLSearchParams(window.location.search);
            currentProjectId = params.get('project') || 'default';
            return db.ref('prod_budgets/' + currentProjectId);
        }

        function fetchAllData() {
            return new Promise((resolve, reject) => {
                if (!firebaseInitialized || !db) reject(new Error('Firebase not ready'));
                getRootRef().once('value', snap => {
                    const val = snap.val() || {};
                    resolve({
                        batches: val.batches || [],
                        monthlyBudgets: val.monthlyBudgets || [],
                        batchCategories: val.batchCategories || [],
                        monthlyCategories: val.monthlyCategories || []
                    });
                }, reject);
            });
        }

        function saveAllData(data) {
            return new Promise((resolve, reject) => {
                if (!firebaseInitialized || !db) reject(new Error('Firebase not ready'));
                getRootRef().set(data, err => err ? reject(err) : resolve());
            });
        }

        function listenDataChange(callback) {
            const ref = getRootRef();
            const listener = ref.on('value', snap => {
                const val = snap.val() || {};
                callback({
                    batches: val.batches || [],
                    monthlyBudgets: val.monthlyBudgets || [],
                    batchCategories: val.batchCategories || [],
                    monthlyCategories: val.monthlyCategories || []
                });
            }, err => {
                console.error('监听出错:', err);
                updateSyncStatus(false);
            });
            return () => ref.off('value', listener);
        }

        //  全局状态

        //  工具函数
        // ================================================================
        function generateId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }

        function formatCurrency(v) { return '¥' + Number(v).toFixed(2); }

        function getBatchTotalBudget(b) { return b.budgetItems.reduce((s, i) => s + i.budget, 0); }

        function getBatchTotalActual(b) { return b.actuals.reduce((s, a) => s + a.amount, 0); }

        function getMonthlyTotalBudget(m) { return m.budgetItems.reduce((s, i) => s + i.budget, 0); }

        function getMonthlyTotalActual(m) { return m.actuals.reduce((s, a) => s + a.amount, 0); }

        function getCategoryBudget(batch, cat) {
            const item = batch.budgetItems.find(i => i.category === cat);
            return item ? item.budget : 0;
        }

        function getCategoryActual(batch, cat) {
            return batch.actuals.filter(a => a.category === cat).reduce((s, a) => s + a.amount, 0);
        }

        function getBatchAlert(batch) {
            const totalBudget = getBatchTotalBudget(batch);
            const totalActual = getBatchTotalActual(batch);
            if (totalBudget === 0) return { level: 'none', percent: 0, diff: 0, diffPercent: 0 };
            const percent = (totalActual / totalBudget) * 100;
            const diff = totalActual - totalBudget;
            const diffPercent = (diff / totalBudget) * 100;
            let level = 'normal';
            if (percent >= 100) level = 'danger';
            else if (percent >= 90) level = 'warning';
            return { level, percent, diff, diffPercent };
        }

        function getMonthlyAlert(monthly) {
            const totalBudget = getMonthlyTotalBudget(monthly);
            const totalActual = getMonthlyTotalActual(monthly);
            if (totalBudget === 0) return { level: 'none', percent: 0, diff: 0, diffPercent: 0 };
            const percent = (totalActual / totalBudget) * 100;
            const diff = totalActual - totalBudget;
            const diffPercent = (diff / totalBudget) * 100;
            let level = 'normal';
            if (percent >= 100) level = 'danger';
            else if (percent >= 90) level = 'warning';
            return { level, percent, diff, diffPercent };
        }

        function formatDate(date) {
            const d = new Date(date);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        // ================================================================
        //  CSV 导出（简略）
        // ================================================================
        function downloadCSV(csvString, filename) {
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadBatchCSV(batchId) {
            const batch = batches.find(b => b.id === batchId);
            if (!batch) { showToast('批次不存在', 'error'); return; }
            const rows = [
                ['批次名称', '类别', '预算金额', '实际支出', '差异', '差异百分比(%)', '完成率(%)']
            ];
            const cats = batchCategories.length ? batchCategories : DEFAULT_BATCH_CATEGORIES;
            cats.forEach(cat => {
                const budget = getCategoryBudget(batch, cat);
                const actual = getCategoryActual(batch, cat);
                const diff = actual - budget;
                const diffPercent = budget > 0 ? (diff / budget) * 100 : 0;
                const completePercent = budget > 0 ? (actual / budget) * 100 : 0;
                rows.push([batch.name, cat, budget.toFixed(2), actual.toFixed(2), diff.toFixed(2), diffPercent.toFixed(1),
                    completePercent.toFixed(1)
                ]);
            });
            const totalBudget = getBatchTotalBudget(batch);
            const totalActual = getBatchTotalActual(batch);
            const totalDiff = totalActual - totalBudget;
            const totalDiffPercent = totalBudget > 0 ? (totalDiff / totalBudget) * 100 : 0;
            const totalCompletePercent = totalBudget > 0 ? (totalActual / totalBudget) * 100 : 0;
            rows.push([batch.name + ' (合计)', '', totalBudget.toFixed(2), totalActual.toFixed(2), totalDiff.toFixed(2),
                totalDiffPercent.toFixed(1), totalCompletePercent.toFixed(1)
            ]);
            rows.push([]);
            rows.push(['实际支出明细']);
            rows.push(['日期', '类别', '金额']);
            if (batch.actuals.length > 0) {
                batch.actuals.forEach(a => rows.push([a.date, a.category, a.amount.toFixed(2)]));
            } else {
                rows.push(['', '无实际支出', '']);
            }
            const csvContent = rows.map(row => row.join(',')).join('\n');
            downloadCSV(csvContent, `批次_${batch.name}_预算使用情况.csv`);
            showToast('下载成功', 'success');
        }

        // ================================================================
        //  渲染函数
        // ================================================================
        function renderHeaderDate() {
            const now = new Date();
            document.getElementById('headerDate').textContent =
                `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
        }

        function renderBatches() {
            const container = document.getElementById('batchListContainer');
            const filter = document.getElementById('batchFilter').value.trim().toLowerCase();
            let filtered = batches;
            if (filter) filtered = batches.filter(b => b.name.toLowerCase().includes(filter));
            document.getElementById('batchCount').textContent = `共 ${filtered.length} 个批次`;

            if (filtered.length === 0) {
                container.innerHTML =
                    `<div class="card"><div class="empty-state"><div class="icon">📭</div><p>暂无批次，点击「新建批次」开始</p></div></div>`;
                return;
            }

            let html = '';
            filtered.forEach(batch => {
                const totalBudget = getBatchTotalBudget(batch);
                const totalActual = getBatchTotalActual(batch);
                const alert = getBatchAlert(batch);
                const statusClass = alert.level === 'danger' ? 'tag-danger' :
                    alert.level === 'warning' ? 'tag-warning' : 'tag-success';
                const statusText = alert.level === 'danger' ? '⚠️ 超支' :
                    alert.level === 'warning' ? '⚡ 接近预算' : '✅ 正常';
                const progress = totalBudget > 0 ? Math.min((totalActual / totalBudget) * 100, 100) : 0;
                const fillClass = alert.level === 'danger' ? 'red' :
                    alert.level === 'warning' ? 'yellow' : 'green';

                html += `
                    <div class="batch-card" data-id="${batch.id}">
                        <div class="batch-header">
                            <span class="batch-name">${batch.name}</span>
                            <span>
                                <span class="tag ${statusClass}">${statusText}</span>
                                <span class="text-muted text-small" style="margin-left:8px;">预算: ${formatCurrency(totalBudget)}</span>
                            </span>
                        </div>
                        <div class="flex-between" style="margin-top:6px;">
                            <span class="text-muted text-small">已用: ${formatCurrency(totalActual)} (${progress.toFixed(1)}%)</span>
                            <span class="text-small" style="font-weight:600; color:${alert.diff >= 0 ? 'var(--danger)' : 'var(--success)'};">
                                ${alert.diff >= 0 ? '超支' : '节约'} ${formatCurrency(Math.abs(alert.diff))} (${alert.diffPercent >= 0 ? '+' : ''}${alert.diffPercent.toFixed(1)}%)
                            </span>
                        </div>
                        <div class="progress-bar"><div class="fill ${fillClass}" style="width:${progress}%;"></div></div>
                        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                            <button class="btn btn-outline btn-sm view-batch-detail" data-id="${batch.id}">📋 详情</button>
                            <button class="btn btn-warning btn-sm edit-batch-budget" data-id="${batch.id}">✏️ 编辑预算</button>
                            <button class="btn btn-success btn-sm add-batch-actual" data-id="${batch.id}">➕ 录入支出</button>
                            <button class="btn btn-warning btn-sm download-batch-csv" data-id="${batch.id}">📥 导出CSV</button>
                            <button class="btn btn-danger btn-sm delete-batch" data-id="${batch.id}">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.view-batch-detail').forEach(btn => {
                btn.addEventListener('click', e => { e.stopPropagation();
                    showBatchDetail(btn.dataset.id); });
            });
            container.querySelectorAll('.edit-batch-budget').forEach(btn => {
                btn.addEventListener('click', e => { e.stopPropagation();
                    openEditBatchModal(btn.dataset.id); });
            });
            container.querySelectorAll('.add-batch-actual').forEach(btn => {
                btn.addEventListener('click', e => { e.stopPropagation();
                    openBatchActualModal(btn.dataset.id); });
            });
            container.querySelectorAll('.download-batch-csv').forEach(btn => {
                btn.addEventListener('click', e => { e.stopPropagation();
                    downloadBatchCSV(btn.dataset.id); });
            });
            container.querySelectorAll('.delete-batch').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    if (confirm('确定删除该批次及其所有数据吗？')) {
                        batches = batches.filter(b => b.id !== btn.dataset.id);
                        pushDataToFirebase()
                            .then(() => showToast('批次已删除', 'success'))
                            .catch(() => showToast('删除失败', 'error'));
                    }
                });
            });
            container.querySelectorAll('.batch-card').forEach(card => {
                card.addEventListener('click', function() { showBatchDetail(this.dataset.id); });
            });
        }

        function showBatchDetail(id) {
            const batch = batches.find(b => b.id === id);
            if (!batch) return;
            const cats = batchCategories.length ? batchCategories : DEFAULT_BATCH_CATEGORIES;
            let detailHtml =
                `<div style="margin-bottom:12px;"><strong>${batch.name}</strong><span class="text-muted text-small" style="margin-left:12px;">总预算: ${formatCurrency(getBatchTotalBudget(batch))}</span><span class="text-muted text-small">已支出: ${formatCurrency(getBatchTotalActual(batch))}</span></div>
                <div class="table-wrap"><table><thead><tr><th>类别</th><th>预算</th><th>实际</th><th>差异</th><th>完成%</th></tr></thead><tbody>`;
            cats.forEach(cat => {
                const budget = getCategoryBudget(batch, cat);
                const actual = getCategoryActual(batch, cat);
                const diff = actual - budget;

        // ================================================================
        //  数据同步（返回 Promise）
        // ================================================================
        function pushDataToFirebase() {
            return new Promise((resolve, reject) => {
                if (pushPending) {
                    reject(new Error('正在同步中...'));
                    return;
                }
                pushPending = true;
                const data = {
                    batches: batches,
                    monthlyBudgets: monthlyBudgets,
                    batchCategories: batchCategories,
                    monthlyCategories: monthlyCategories
                };
                saveAllData(data).then(() => {
                    pushPending = false;
                    saveLocalCache(data);
                    updateSyncStatus(true);
                    resolve();
                }).catch(err => {
                    pushPending = false;
                    console.error('保存到 Firebase 失败:', err);
                    updateSyncStatus(false);
                    reject(err);
                });
            });
        }

        function saveLocalCache(data) {
            try {
                localStorage.setItem('prod_cache_' + currentProjectId, JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        function loadLocalCache() {
            try {
                const raw = localStorage.getItem('prod_cache_' + currentProjectId);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }

        function updateSyncStatus(online) {
            const dot = document.getElementById('syncDot');
            const label = document.getElementById('syncLabel');
            if (online) {
                dot.className = 'dot online';
                label.textContent = '实时同步';
            } else {
                dot.className = 'dot offline';
                label.textContent = '离线';
            }
        }

        function onRemoteDataUpdate(data) {
            if (pushPending) return; // 避免循环
            batches = data.batches || [];
            monthlyBudgets = data.monthlyBudgets || [];
            batchCategories = data.batchCategories || [];
            monthlyCategories = data.monthlyCategories || [];
            saveLocalCache(data);
            renderAll();
            updateSyncStatus(true);
        }

        function startListening() {
            if (unlistenFn) {
                unlistenFn();
                unlistenFn = null;
            }
            if (!firebaseInitialized || !db) return;
            unlistenFn = listenDataChange(onRemoteDataUpdate);
        }

        function loadInitialData() {
            const cache = loadLocalCache();

                batchCategories = cache.batchCategories || [];
                monthlyCategories = cache.monthlyCategories || [];
                renderAll();
                updateSyncStatus(false);
                console.log('📦 从本地缓存加载数据');
            }

            if (!firebaseInitialized || !db) {
                showToast('⚠️ Firebase 未连接，请检查配置', 'error');
                return;
            }

            fetchAllData().then((data) => {
                if (data.batches.length || data.monthlyBudgets.length || data.batchCategories.length || data
                    .monthlyCategories.length) {
                    batches = data.batches;
                    monthlyBudgets = data.monthlyBudgets;

                    monthlyCategories = data.monthlyCategories.length ? data.monthlyCategories :

                    saveLocalCache(data);
                    renderAll();
                    updateSyncStatus(true);
                    console.log('☁️ 从 Firebase 加载数据');
                } else {
                    if (!cache) {
                        batchCategories = [...DEFAULT_BATCH_CATEGORIES];

        // ================================================================

        let toastTimer;

        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (type ? ' ' + type : '');
            clearTimeout(toastTimer);
            void el.offsetWidth;
            el.classList.add('show');
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
            if (pageId === 'pageAlerts') renderAlerts();
        }

        document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {

        // ================================================================
        //  分享链接
        // ================================================================
        function updateShareUrl() {
            const url = window.location.href.split('?')[0];
            const params = new URLSearchParams(window.location.search);
            const project = params.get('project') || 'default';
            const shareUrl = url + '?project=' + encodeURIComponent(project);
            document.getElementById('shareUrlDisplay').textContent = shareUrl;
            return shareUrl;
        }

        document.getElementById('copyShareUrl').addEventListener('click', function() {
            const url = updateShareUrl();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('✅ 链接已复制，分享给团队成员即可同步', 'success');
                }).catch(() => {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('✅ 链接已复制，分享给团队成员即可同步', 'success');
            } catch (e) {
                showToast('请手动复制链接', 'warning');
            }
            document.body.removeChild(ta);
        }

            console.log('📌 项目ID:', currentProjectId);
            console.log('🔗 分享链接:', updateShareUrl());
        }
